<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  #470 — Inter on e2e-linux.

  Copied to /etc/fonts/local.conf on the e2e-linux runner (see
  .github/workflows/e2e-linux.yml's "Install CI fonts" step). Not an
  app-code change: this is a fontconfig substitution rule, read by
  WebKitGTK/Pango at render time via the OS font lookup, not by anything
  under src/. App code (app.css, every component's font-family) is
  unchanged by this PR.

  Why this is needed even after `apt-get install fonts-inter`: a plain
  install only satisfies stacks that already name 'Inter' somewhere in
  their list (so the browser's own CSS font-family fallback eventually
  reaches it). Reed's audit (docs/audits/2026-11-26-scope-470-fonts.md
  §1) found ~50 font-family rules across src/ — including src/app.css:188
  (the html,body root every unstyled element inherits, which is what
  AgentCreateOverlay.svelte's own h1/subtitle fall through to) — that
  hardcode -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI',
  sans-serif with NO 'Inter' anywhere in the list. CSS fallback can't
  reach a name that was never written. Fontconfig aliasing intercepts
  ABOVE that lookup: when WebKitGTK asks fontconfig "give me a font for
  family X", these <match> rules substitute 'Inter' for X before the
  lookup runs, so the very first name in any stack above resolves to
  Inter directly — no CSS fallback chain needed at all.
-->
<fontconfig>
  <!-- Every font-family stack in the codebase starts with one of these
       names (confirmed by grep across src/ in Reed's scope) — none skips
       straight to a generic family as its first entry. -->
  <match target="pattern">
    <test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SF Pro Text</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>
  <!-- Belt-and-suspenders: any stack whose entire list fails to match
       anything above and falls through to the bare generic. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
</fontconfig>
