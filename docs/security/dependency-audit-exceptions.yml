# Dependency-audit exception manifest — Refs #3106 (4.5 scope: dependency-audit gate)
#
# This is the ONLY place a finding gets suppressed. Neither cargo-audit's
# audit.toml `ignore` array nor pnpm's `pnpm.auditConfig.ignoreCves` supports
# a reason or an expiry — both are bare ID lists with no enforceable
# metadata (TOML comments are unparseable by cargo-audit; package.json has
# no per-entry field at all). scripts/check-dependency-exceptions.sh reads
# this file, builds the tool-native suppressions, and — independent of
# whatever cargo-audit/pnpm audit themselves report — fails the job outright
# if `today > review_by` for ANY entry, on every PR run and on the weekly
# schedule. A stale entry does not quietly keep suppressing its finding; it
# actively breaks CI until a human re-justifies it (bumps review_by — a
# diff, visible in review and git blame) or removes the entry and fixes the
# underlying finding. "Nothing is silenced silently."
#
# Fields:
#   id        - RUSTSEC-xxxx-xxxx (cargo scopes) or the pnpm advisory ID (pnpm scope)
#   package   - the package the finding is reported against
#   scope     - cargo-tauri | cargo-gateway | pnpm
#   reason    - why this isn't fixed in THIS PR (not why it's safe forever)
#   added     - date this entry was created
#   review_by - hard deadline; CI fails after this date until renewed or removed

# ---------------------------------------------------------------------------
# cargo-tauri — deferred to their own follow-up PRs (see PR body for issue links)
# ---------------------------------------------------------------------------

- id: RUSTSEC-2026-0459
  package: libsqlite3-sys
  scope: cargo-tauri
  reason: >
    0.30.1 -> >=0.39.0 is a 9-minor jump that also requires a coordinated
    rusqlite bump (rusqlite 0.32's own Cargo.toml constrains how far
    libsqlite3-sys can move without it). Corrected framing, verified against
    source: crsqlite.dylib has NO mechanical link to this crate or to
    src-tauri/Cargo.lock — it is built by
    scripts/build-crsqlite-universal.sh from a separate, pinned
    vlcn-io/cr-sqlite clone, under its own toolchain, and "1631456" (the
    dylib's byte count) appears zero times in scripts/ or
    .github/workflows/. The real risk is extension-ABI compatibility: cr-sqlite
    is a loadable extension built against a 2024-era SQLite header set, and a
    9-minor jump in the bundled SQLite libsqlite3-sys compiles changes the
    engine it gets loaded into. That needs verification via the
    fresh-install/upgrade smoke tests that exercise crsql_internal_sync_bit
    and friends, not a version-number edit inside a CI-hardening PR.
  added: 2026-11-10
  review_by: 2026-12-01

- id: RUSTSEC-2026-0429
  package: zip
  scope: cargo-tauri
  reason: >
    GHSA-q7v9-x93c-xqv3, ZipArchive::extract() aborts the process on a
    symlink entry with an oversized declared size. Re-justified #3217
    bucket-2/3: pane's own direct zip dependency (src-tauri/src/
    attachments.rs's docx extractor, ZipArchive::new / .by_name() /
    ZipWriter::new / SimpleFileOptions, test-fixture-only writer) moved to
    9.6.0 in this PR, off the vulnerable 4.6.1 line entirely. This advisory
    stays open and this entry stays in place because the remaining 4.x
    resolution is tauri-plugin-updater@2.11.0's own pin (zip = "^4",
    cfg(target_os = "windows") only, confirmed via crates.io's dependencies
    API); Pane ships no Windows build, and this PR cannot move a pin inside
    a third-party plugin crate. src-tauri/Cargo.lock now carries two zip
    entries (9.6.0 for pane, 4.6.1 for the plugin's Windows-only branch) by
    design, not by omission; Cargo.lock is not platform-filtered, so
    cargo-audit will keep finding the lingering entry on every platform.
    This bump is hygiene for pane's own code, not a closure of this advisory.
  added: 2026-11-16
  review_by: 2027-01-15

