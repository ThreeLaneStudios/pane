name: Docs Issue Reference Check

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

permissions:
  issues: write

jobs:
  check-issue-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Check commit message for issue reference
        uses: actions/github-script@v7
        with:
          script: |
            const commits = context.payload.commits || [];
            const flagged = [];
            
            for (const commit of commits) {
              const msg = commit.message || '';
              const hasIssueRef = /#\d+/.test(msg);
              
              if (!hasIssueRef) {
                flagged.push({
                  sha: commit.id.substring(0, 7),
                  message: msg.split('\n')[0],
                  author: commit.author?.name || 'unknown'
                });
              }
            }
            
            if (flagged.length > 0) {
              const details = flagged.map(c => 
                `- \`${c.sha}\` by ${c.author}: "${c.message}"`
              ).join('\n');
              
              // Create an issue to flag it
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `⚠️ Spec changed without issue reference — ${new Date().toISOString().split('T')[0]}`,
                body: `The following commit(s) modified \`docs/\` without an issue reference (\`#NNN\`) in the commit message:\n\n${details}\n\n**Action required:** Link these changes to an issue, or confirm they were intentional.\n\nSee [CONTRIBUTING.md](https://github.com/ThreeLaneStudios/pane/blob/main/CONTRIBUTING.md) for the spec-driven workflow.`
              });
              
              console.log(`⚠️ Flagged ${flagged.length} commit(s) without issue reference`);
            } else {
              console.log('✅ All doc commits have issue references');
            }
