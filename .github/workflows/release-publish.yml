name: CI — Release Publish (Build-Source Guard)

# =============================================================================
# Release publishing pipeline — production branch + protected pipeline
#
# Mechanizes the release runbook (docs/release-runbook.md). Triggers on any
# `v*` tag push and recognizes exactly two tag shapes:
#
#   - Public:  vX.Y.Z            → GitHub Release (public), MUST be built
#                                   from a commit already promoted to `prod`
#   - Dev:     vX.Y.Z-dev        → GitHub Release (prerelease), MUST be built
#                                   from a commit on `main`
#
# `guard-tag-branch` is the mechanized enforcement for #2340 item 2 — it
# fails BEFORE any build step runs if the tagged commit's branch ancestry
# doesn't match the tag shape:
#   - bare vX.Y.Z tag whose commit is not yet promoted to `prod` → FAIL
#   - vX.Y.Z-dev tag whose commit isn't on `main` (e.g. a prod-only
#     promotion-merge commit) → FAIL
# There is no skip mechanism. This is what makes `prod`'s protection
# structurally meaningful instead of governance theater.
#
# Auto-updater (updates.paneapp.ai) is explicitly OUT of scope here — this
# workflow does not touch it. See docs/release-runbook.md's note on that.
# =============================================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard-tag-branch:
    if: github.event_name == 'push'
    name: Guard — tag shape vs. source branch
    runs-on: ubuntu-latest
    outputs:
      tag_kind: ${{ steps.classify.outputs.kind }}
      tag_version: ${{ steps.classify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — ancestor checks need it

      - name: Classify tag + verify branch ancestry
        id: classify
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA}"

          echo "Tag: $TAG"
          echo "Commit: $SHA"

          # Explicit refspecs — don't rely on actions/checkout's implicit
          # remote-tracking setup, which only fetches the triggering ref.
          git fetch origin main:refs/remotes/origin/main prod:refs/remotes/origin/prod --quiet

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            KIND="public"
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-dev$ ]]; then
            KIND="dev"
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "❌ Tag '$TAG' does not match a recognized release-pipeline shape."
            echo "   Expected: vX.Y.Z (public release) or vX.Y.Z-dev (dev prerelease)."
            echo "   See docs/release-runbook.md."
            exit 1
          fi

          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$KIND" = "public" ]; then
            echo "🔍 Public release tag — verifying $SHA is on 'prod'..."
            if git merge-base --is-ancestor "$SHA" refs/remotes/origin/prod; then
              echo "✅ $SHA has been promoted to 'prod' — public release build permitted."
            else
              echo ""
              echo "❌ BUILD-SOURCE GUARD FAILED"
              echo ""
              echo "Tag '$TAG' is a bare public-release tag, but commit $SHA has not"
              echo "been promoted to the 'prod' branch. Public releases may ONLY be"
              echo "tagged on commits that already exist on 'prod' (the Release Owner promotes"
              echo "main → prod via PR after a DMG test pass)."
              echo ""
              echo "See docs/release-runbook.md."
              exit 1
            fi
          else
            echo "🔍 Dev/prerelease tag — verifying $SHA is on 'main'..."
            if git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
              echo "✅ $SHA is on 'main' — dev/prerelease build permitted."
            else
              echo ""
              echo "❌ BUILD-SOURCE GUARD FAILED"
              echo ""
              echo "Tag '$TAG' is a dev/prerelease tag, but commit $SHA is not on"
              echo "'main' (e.g. it's a prod-exclusive commit, such as a promotion"
              echo "merge commit). Dev/prerelease tags may ONLY be cut from 'main'."
              echo ""
              echo "See docs/release-runbook.md."
              exit 1
            fi
          fi

  build-linux:
    if: github.event_name == 'push'
    name: Build Linux bundles
    needs: [guard-tag-branch]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10.29.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-gateway

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public tag matches app version
        if: needs.guard-tag-branch.outputs.tag_kind == 'public'
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Public tag version $TAG_VERSION does not match package version $APP_VERSION."
            exit 1
          fi

      - name: Build Linux bundles
        run: pnpm exec tauri build --bundles deb,rpm,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Build Linux gateway
        run: |
          cargo build --release --locked --manifest-path src-gateway/Cargo.toml
          src-gateway/target/release/pane-gateway --version

      - name: Stage Linux release assets
        run: |
          VERSION=$(node -p "require('./package.json').version")
          GATEWAY_VERSION=$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' src-gateway/Cargo.toml | head -1)
          STAGE="$RUNNER_TEMP/linux-release"
          GATEWAY_STAGE="$RUNNER_TEMP/gateway-linux"
          GATEWAY_DEB_ROOT="$RUNNER_TEMP/gateway-deb"
          RPM_TOPDIR="$RUNNER_TEMP/gateway-rpm"
          PANE_DEB="pane-linux-x86_64.deb"
          PANE_RPM="pane-linux-x86_64.rpm"
          PANE_APPIMAGE="pane-linux-x86_64.AppImage"
          GATEWAY_ARCHIVE="pane-gateway-linux-x86_64.tar.gz"
          GATEWAY_DEB="pane-gateway-linux-x86_64.deb"
          GATEWAY_RPM="pane-gateway-linux-x86_64.rpm"

          mkdir -p "$STAGE" "$GATEWAY_STAGE"
          cp "src-tauri/target/release/bundle/deb/Pane_${VERSION}_amd64.deb" "$STAGE/$PANE_DEB"
          cp "src-tauri/target/release/bundle/rpm/Pane-${VERSION}-1.x86_64.rpm" "$STAGE/$PANE_RPM"
          cp "src-tauri/target/release/bundle/appimage/Pane_${VERSION}_amd64.AppImage" "$STAGE/$PANE_APPIMAGE"

          cp src-gateway/target/release/pane-gateway "$GATEWAY_STAGE/"
          cp src-gateway/README.md "$GATEWAY_STAGE/README.md"
          tar -C "$GATEWAY_STAGE" -czf "$STAGE/$GATEWAY_ARCHIVE" pane-gateway README.md

          install -Dm755 src-gateway/target/release/pane-gateway \
            "$GATEWAY_DEB_ROOT/usr/bin/pane-gateway"
          install -Dm644 src-gateway/README.md \
            "$GATEWAY_DEB_ROOT/usr/share/doc/pane-gateway/README.md"
          mkdir -p "$GATEWAY_DEB_ROOT/DEBIAN" "$RUNNER_TEMP/gateway-shlibdeps/debian"
          cat > "$RUNNER_TEMP/gateway-shlibdeps/debian/control" <<EOF
          Source: pane-gateway
          Section: utils
          Priority: optional
          Maintainer: Three Lane Studios LLC
          Standards-Version: 4.6.2

          Package: pane-gateway
          Architecture: any
          Description: Local Pane gateway
          EOF
          GATEWAY_DEPENDS=$(cd "$RUNNER_TEMP/gateway-shlibdeps" && \
            dpkg-shlibdeps -O -e"$GITHUB_WORKSPACE/src-gateway/target/release/pane-gateway" \
            | sed 's/^shlibs:Depends=//')
          if [ -z "$GATEWAY_DEPENDS" ]; then
            echo "❌ Failed to derive Gateway DEB runtime dependencies."
            exit 1
          fi
          cat > "$GATEWAY_DEB_ROOT/DEBIAN/control" <<EOF
          Package: pane-gateway
          Version: $GATEWAY_VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Three Lane Studios LLC
          Depends: $GATEWAY_DEPENDS
          Description: Local Pane gateway for AI requests, sync, sessions, and authentication.
          EOF
          dpkg-deb --build --root-owner-group "$GATEWAY_DEB_ROOT" "$STAGE/$GATEWAY_DEB"
          dpkg-deb --info "$STAGE/$GATEWAY_DEB"

          mkdir -p \
            "$RPM_TOPDIR/BUILD" \
            "$RPM_TOPDIR/BUILDROOT" \
            "$RPM_TOPDIR/RPMS" \
            "$RPM_TOPDIR/SOURCES" \
            "$RPM_TOPDIR/SPECS" \
            "$RPM_TOPDIR/SRPMS"
          cat > "$RPM_TOPDIR/SPECS/pane-gateway.spec" <<EOF
          Name: pane-gateway
          Version: $GATEWAY_VERSION
          Release: 1%{?dist}
          Summary: Local Pane gateway
          License: Proprietary
          BuildArch: x86_64

          %description
          Local Pane gateway for AI requests, sync, sessions, and authentication.

          %install
          install -Dm755 %{_gateway_binary} %{buildroot}%{_bindir}/pane-gateway
          install -Dm644 %{_gateway_readme} %{buildroot}%{_docdir}/pane-gateway/README.md

          %files
          %{_bindir}/pane-gateway
          %doc %{_docdir}/pane-gateway/README.md
          EOF
          rpmbuild -bb \
            --define "_topdir $RPM_TOPDIR" \
            --define "_gateway_binary $GITHUB_WORKSPACE/src-gateway/target/release/pane-gateway" \
            --define "_gateway_readme $GITHUB_WORKSPACE/src-gateway/README.md" \
            "$RPM_TOPDIR/SPECS/pane-gateway.spec"
          mapfile -t GATEWAY_RPM_PATHS < <(find "$RPM_TOPDIR/RPMS/x86_64" -maxdepth 1 -type f -name 'pane-gateway-*.x86_64.rpm')
          if [ "${#GATEWAY_RPM_PATHS[@]}" -ne 1 ]; then
            echo "❌ Expected exactly one Gateway RPM, found ${#GATEWAY_RPM_PATHS[@]}."
            printf '  %s\n' "${GATEWAY_RPM_PATHS[@]}"
            exit 1
          fi
          cp "${GATEWAY_RPM_PATHS[0]}" "$STAGE/$GATEWAY_RPM"
          rpm -qip "$STAGE/$GATEWAY_RPM"

          cd "$STAGE"
          sha256sum \
            "$PANE_DEB" \
            "$PANE_RPM" \
            "$PANE_APPIMAGE" \
            "$GATEWAY_DEB" \
            "$GATEWAY_RPM" \
            "$GATEWAY_ARCHIVE" \
            > "SHA256SUMS.txt"

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: ${{ runner.temp }}/linux-release/
          if-no-files-found: error
          retention-days: 7

  build-and-publish:
    if: github.event_name == 'push'
    name: Build + publish GitHub Release
    needs: [guard-tag-branch, build-linux]
    permissions:
      contents: write
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Add Rust toolchain to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID certificate into temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "❌ Apple signing certificate secrets are required."
            exit 1
          fi

          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/pane-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/pane-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)

          security list-keychains -d user \
            | sed 's/^[[:space:]]*"//; s/"$//' \
            > "$RUNNER_TEMP/original-keychains.txt"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          KEYCHAINS=("$KEYCHAIN_PATH")
          while IFS= read -r keychain; do
            [ -n "$keychain" ] && KEYCHAINS+=("$keychain")
          done < "$RUNNER_TEMP/original-keychains.txt"
          security list-keychains -d user -s "${KEYCHAINS[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Build and package macOS gateway
        id: gateway
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "❌ APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID secrets are required for notarized gateway releases."
            exit 1
          fi

          GATEWAY_VERSION=$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' src-gateway/Cargo.toml | head -1)
          STAGE=$(mktemp -d /tmp/pane-gateway.XXXXXX)
          DMG="/tmp/PaneGateway-aarch64.dmg"

          cargo build --release --locked --manifest-path src-gateway/Cargo.toml
          src-gateway/target/release/pane-gateway --version
          cp src-gateway/target/release/pane-gateway "$STAGE/pane-gateway"
          cp src-gateway/README.md "$STAGE/README.md"

          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$STAGE/pane-gateway"
          codesign --verify --strict --verbose=2 "$STAGE/pane-gateway"
          hdiutil create -volname "Pane Gateway" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"

          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

          rm -rf "$STAGE"
          echo "version=$GATEWAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$DMG" >> "$GITHUB_OUTPUT"

      - name: Build signed Pane app and DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "❌ GitHub secret TAURI_SIGNING_PRIVATE_KEY is not configured."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "❌ GitHub secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured."
            exit 1
          fi
          pnpm exec tauri build --target universal-apple-darwin

      - name: Notarize and verify Pane DMG
        id: artifacts
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # #3247: shared hdiutil attach/detach helpers (#3049), same ones
          # scripts/build.sh sources, so CI's packaging stops bypassing the
          # mount-safety hardening those helpers encode.
          # shellcheck source=scripts/lib/dmg.sh
          source "$(pwd)/scripts/lib/dmg.sh"

          VERSION=$(node -p "require('./package.json').version")
          TAURI_DMG_DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Pane.app"
          SOURCE_DMG=$(find "$TAURI_DMG_DIR" -maxdepth 1 -name '*.dmg' -print -quit)
          # Public asset names are versionless; the release tag identifies the version.
          FINAL_DMG="/tmp/Pane-universal.dmg"
          WORK_DMG="/tmp/Pane_${VERSION}_work.dmg"
          RW_DMG="/tmp/Pane_${VERSION}_work_rw.dmg"
          STAGING_DMG="/tmp/.Pane_${VERSION}.building.dmg"
          NOTARIZE_ZIP="/tmp/Pane_${VERSION}_notarize.zip"
          MOUNT_POINT="$RUNNER_TEMP/pane-release-mount"
          DS_STORE_ASSET="$(pwd)/scripts/assets/dmg-layout/pane-1.0.85.dsstore"

          if [ -z "$SOURCE_DMG" ]; then
            echo "❌ Tauri did not produce a DMG at $TAURI_DMG_DIR."
            exit 1
          fi
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ App bundle not found at $APP_PATH."
            exit 1
          fi
          rm -f "$WORK_DMG" "$RW_DMG" "$STAGING_DMG" "$NOTARIZE_ZIP" "$FINAL_DMG"

          # --- Notarize + staple the app itself, BEFORE the swap (Reed's
          # ruling 2: build.sh already does this; CI never did) ---
          echo "📤 Submitting app for notarization..."
          ditto -c -k --keepParent "$APP_PATH" "$NOTARIZE_ZIP"
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          rm -f "$NOTARIZE_ZIP"
          echo "📎 Stapling ticket to app..."
          xcrun stapler staple "$APP_PATH"
          echo "✅ App stapled"

          # --- Swap the stapled app into Tauri's DMG and apply the
          # prebuilt .DS_Store layout, in ONE mount window (#3049's
          # swap-mount block, reused, not a second attach/detach cycle) ---
          cp "$SOURCE_DMG" "$WORK_DMG"
          dmg_convert_or_die "$WORK_DMG" UDRW "$RW_DMG"
          rm -f "$WORK_DMG"

          mkdir -p "$MOUNT_POINT"
          dmg_attach_or_die "$RW_DMG" "$MOUNT_POINT" -readwrite
          rm -rf "$MOUNT_POINT/Pane.app"
          ditto "$APP_PATH" "$MOUNT_POINT/Pane.app"
          if [ ! -x "$MOUNT_POINT/Pane.app/Contents/MacOS/Pane" ]; then
            echo "❌ ditto did not land a usable Pane.app inside the mount, the swap did not take"
            dmg_detach_or_die "$MOUNT_POINT"
            exit 1
          fi
          echo "✅ Swapped in the signed/notarized/stapled app"
          dmg_apply_ds_store "$MOUNT_POINT" "$DS_STORE_ASSET"
          echo "✅ Applied .DS_Store window layout"
          dmg_detach_or_die "$MOUNT_POINT"
          rmdir "$MOUNT_POINT" 2>/dev/null || true

          dmg_convert_or_die "$RW_DMG" UDZO "$STAGING_DMG"
          rm -f "$RW_DMG"
          mv -f "$STAGING_DMG" "$FINAL_DMG"

          # --- Notarize + staple the DMG itself (unchanged behavior) ---
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$FINAL_DMG"
          codesign --verify --strict --verbose=2 "$FINAL_DMG"
          xcrun notarytool submit "$FINAL_DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$FINAL_DMG"
          xcrun stapler validate "$FINAL_DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$FINAL_DMG"

          mkdir -p "$MOUNT_POINT"
          dmg_attach_or_die "$FINAL_DMG" "$MOUNT_POINT" -readonly
          APP_IN_DMG=$(find "$MOUNT_POINT" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_IN_DMG" ]; then
            echo "❌ Notarized DMG does not contain an app bundle."
            dmg_detach_or_die "$MOUNT_POINT"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_IN_DMG"
          spctl --assess --type execute --verbose=4 "$APP_IN_DMG"
          xcrun stapler validate "$APP_IN_DMG"
          dmg_detach_or_die "$MOUNT_POINT"
          rmdir "$MOUNT_POINT" 2>/dev/null || true

          shasum -a 256 "$FINAL_DMG"
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "final_dmg=$FINAL_DMG" >> "$GITHUB_OUTPUT"

      - name: Remove temporary signing keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/pane-signing.keychain-db"
          MOUNT_POINT="$RUNNER_TEMP/pane-release-mount"
          if mount | grep -Fq "$MOUNT_POINT"; then
            hdiutil detach "$MOUNT_POINT" || true
          fi
          if [ -f "$RUNNER_TEMP/original-keychains.txt" ]; then
            KEYCHAINS=()
            while IFS= read -r keychain; do
              [ -n "$keychain" ] && KEYCHAINS+=("$keychain")
            done < "$RUNNER_TEMP/original-keychains.txt"
            if [ "${#KEYCHAINS[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${KEYCHAINS[@]}"
            fi
          fi
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/pane-developer-id.p12" "$RUNNER_TEMP/original-keychains.txt"

      - name: Clean Linux release asset stage
        run: rm -rf /tmp/linux-release

      - name: Download Linux release assets
        uses: actions/download-artifact@v4
        with:
          name: linux-release-assets
          path: /tmp/linux-release

      - name: Create and verify draft GitHub Release (public)
        if: needs.guard-tag-branch.outputs.tag_kind == 'public'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="Public release ${GITHUB_REF_NAME} — built from \`prod\` @ ${GITHUB_SHA}. App version ${{ steps.artifacts.outputs.app_version }}; gateway version ${{ steps.gateway.outputs.version }}."

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Removing incomplete draft from an earlier attempt."
              gh release delete "$TAG" --yes
            else
              echo "❌ A published release already exists for $TAG."
              exit 1
            fi
          fi

          gh release create "$TAG" \
            --title "Pane $TAG" \
            --notes "$NOTES" \
            --draft
          gh release upload "$TAG" \
            "${{ steps.artifacts.outputs.final_dmg }}" \
            "${{ steps.gateway.outputs.dmg_path }}" \
            /tmp/linux-release/*

          ASSET_COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$ASSET_COUNT" -ne 9 ]; then
            echo "❌ Draft release has $ASSET_COUNT assets; expected 9. Upload is incomplete, do not publish this draft."
            exit 1
          fi

      - name: Create GitHub Release (dev/prerelease)
        if: needs.guard-tag-branch.outputs.tag_kind == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.artifacts.outputs.final_dmg }}" \
            "${{ steps.gateway.outputs.dmg_path }}" \
            /tmp/linux-release/* \
            --title "Pane ${GITHUB_REF_NAME} (dev build)" \
            --notes "Dev prerelease ${GITHUB_REF_NAME} — built from \`main\` @ ${GITHUB_SHA}. App version ${{ steps.artifacts.outputs.app_version }}; gateway version ${{ steps.gateway.outputs.version }}. Delivery is via Discord; this GitHub Release is the provenance/archive record, not the distribution channel (repo is private)." \
            --prerelease

  notify-discord:
    name: Notify Discord of release run result
    if: always() && github.event_name == 'push'
    needs: [guard-tag-branch, build-linux, build-and-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Post release result to Discord
        env:
          DISCORD_CI_WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          GUARD_RESULT: ${{ needs.guard-tag-branch.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          PUBLISH_RESULT: ${{ needs.build-and-publish.result }}
        run: |
          if [ -z "$DISCORD_CI_WEBHOOK_URL" ]; then
            echo "⚠️  DISCORD_CI_WEBHOOK_URL not set, skipping Discord notification."
            exit 0
          fi

          CONCLUSION="success"
          FAILING_JOB=""
          if [ "$GUARD_RESULT" != "success" ]; then
            CONCLUSION="failure"
            FAILING_JOB="guard-tag-branch ($GUARD_RESULT)"
          elif [ "$LINUX_RESULT" != "success" ]; then
            CONCLUSION="failure"
            FAILING_JOB="build-linux ($LINUX_RESULT)"
          elif [ "$PUBLISH_RESULT" != "success" ]; then
            CONCLUSION="failure"
            FAILING_JOB="build-and-publish ($PUBLISH_RESULT)"
          fi

          TAG="${GITHUB_REF_NAME}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "$CONCLUSION" = "success" ]; then
            TITLE="✅ Release run succeeded for ${TAG}"
            COLOR=3066993
          else
            TITLE="❌ Release run failed for ${TAG}"
            COLOR=15158332
          fi

          FAILING_JOB_FIELD=""
          if [ -n "$FAILING_JOB" ]; then
            FAILING_JOB_FIELD=", { \"name\": \"Failing job\", \"value\": \"${FAILING_JOB}\" }"
          fi

          curl -sS -X POST "$DISCORD_CI_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "embeds": [{
              "title": "${TITLE}",
              "color": ${COLOR},
              "url": "${RUN_URL}",
              "fields": [
                { "name": "Tag", "value": "${TAG}", "inline": true },
                { "name": "Conclusion", "value": "${CONCLUSION}", "inline": true },
                { "name": "Run", "value": "${RUN_URL}" }${FAILING_JOB_FIELD}
              ]
            }]
          }
          EOF

  test-apple-signing:
    if: github.event_name == 'workflow_dispatch'
    name: Test Pane signing + notarization (no publish)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Add Rust toolchain to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify required secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "❌ Required secret $name is missing."
              exit 1
            fi
          done

      - name: Import Developer ID certificate into temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/pane-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/pane-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)

          security list-keychains -d user \
            | sed 's/^[[:space:]]*"//; s/"$//' \
            > "$RUNNER_TEMP/original-keychains.txt"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          KEYCHAINS=("$KEYCHAIN_PATH")
          while IFS= read -r keychain; do
            [ -n "$keychain" ] && KEYCHAINS+=("$keychain")
          done < "$RUNNER_TEMP/original-keychains.txt"
          security list-keychains -d user -s "${KEYCHAINS[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed Pane DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --target universal-apple-darwin

      - name: Sign, notarize, staple, and verify DMG
        id: notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # #3247: shared hdiutil attach/detach helpers (#3049), same ones
          # scripts/build.sh sources, so CI's packaging stops bypassing the
          # mount-safety hardening those helpers encode.
          # shellcheck source=scripts/lib/dmg.sh
          source "$(pwd)/scripts/lib/dmg.sh"

          VERSION=$(node -p "require('./package.json').version")
          TAURI_DMG_DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Pane.app"
          SOURCE_DMG=$(find "$TAURI_DMG_DIR" -maxdepth 1 -name '*.dmg' -print -quit)
          FINAL_DMG="$RUNNER_TEMP/Pane-universal.dmg"
          WORK_DMG="$RUNNER_TEMP/Pane_${VERSION}_work.dmg"
          RW_DMG="$RUNNER_TEMP/Pane_${VERSION}_work_rw.dmg"
          STAGING_DMG="$RUNNER_TEMP/.Pane_${VERSION}.building.dmg"
          NOTARIZE_ZIP="$RUNNER_TEMP/Pane_${VERSION}_notarize.zip"
          MOUNT_POINT="$RUNNER_TEMP/pane-dmg-mount"
          DS_STORE_ASSET="$(pwd)/scripts/assets/dmg-layout/pane-1.0.85.dsstore"

          if [ -z "$SOURCE_DMG" ]; then
            echo "❌ Tauri did not produce a DMG at $TAURI_DMG_DIR."
            exit 1
          fi
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ App bundle not found at $APP_PATH."
            exit 1
          fi
          rm -f "$WORK_DMG" "$RW_DMG" "$STAGING_DMG" "$NOTARIZE_ZIP" "$FINAL_DMG"

          # --- Notarize + staple the app itself, BEFORE the swap (Reed's
          # ruling 2: build.sh already does this; CI never did) ---
          echo "📤 Submitting app for notarization..."
          ditto -c -k --keepParent "$APP_PATH" "$NOTARIZE_ZIP"
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          rm -f "$NOTARIZE_ZIP"
          echo "📎 Stapling ticket to app..."
          xcrun stapler staple "$APP_PATH"
          echo "✅ App stapled"

          # --- Swap the stapled app into Tauri's DMG and apply the
          # prebuilt .DS_Store layout, in ONE mount window (#3049's
          # swap-mount block, reused, not a second attach/detach cycle) ---
          cp "$SOURCE_DMG" "$WORK_DMG"
          dmg_convert_or_die "$WORK_DMG" UDRW "$RW_DMG"
          rm -f "$WORK_DMG"

          mkdir -p "$MOUNT_POINT"
          dmg_attach_or_die "$RW_DMG" "$MOUNT_POINT" -readwrite
          rm -rf "$MOUNT_POINT/Pane.app"
          ditto "$APP_PATH" "$MOUNT_POINT/Pane.app"
          if [ ! -x "$MOUNT_POINT/Pane.app/Contents/MacOS/Pane" ]; then
            echo "❌ ditto did not land a usable Pane.app inside the mount, the swap did not take"
            dmg_detach_or_die "$MOUNT_POINT"
            exit 1
          fi
          echo "✅ Swapped in the signed/notarized/stapled app"
          dmg_apply_ds_store "$MOUNT_POINT" "$DS_STORE_ASSET"
          echo "✅ Applied .DS_Store window layout"
          dmg_detach_or_die "$MOUNT_POINT"
          rmdir "$MOUNT_POINT" 2>/dev/null || true

          dmg_convert_or_die "$RW_DMG" UDZO "$STAGING_DMG"
          rm -f "$RW_DMG"
          mv -f "$STAGING_DMG" "$FINAL_DMG"

          # --- Notarize + staple the DMG itself (unchanged behavior) ---
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$FINAL_DMG"
          codesign --verify --strict --verbose=2 "$FINAL_DMG"
          xcrun notarytool submit "$FINAL_DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$FINAL_DMG"
          xcrun stapler validate "$FINAL_DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$FINAL_DMG"

          mkdir -p "$MOUNT_POINT"
          dmg_attach_or_die "$FINAL_DMG" "$MOUNT_POINT" -readonly
          APP_IN_DMG=$(find "$MOUNT_POINT" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_IN_DMG" ]; then
            echo "❌ Signed DMG does not contain an app bundle."
            dmg_detach_or_die "$MOUNT_POINT"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_IN_DMG"
          spctl --assess --type execute --verbose=4 "$APP_IN_DMG"
          xcrun stapler validate "$APP_IN_DMG"
          dmg_detach_or_die "$MOUNT_POINT"
          rmdir "$MOUNT_POINT" 2>/dev/null || true

          shasum -a 256 "$FINAL_DMG"
          echo "dmg_path=$FINAL_DMG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload notarized Pane DMG test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pane-${{ steps.notarize.outputs.version }}-signed-notarized
          path: ${{ steps.notarize.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/pane-signing.keychain-db"
          MOUNT_POINT="$RUNNER_TEMP/pane-dmg-mount"
          if mount | grep -Fq "$MOUNT_POINT"; then
            hdiutil detach "$MOUNT_POINT" || true
          fi
          if [ -f "$RUNNER_TEMP/original-keychains.txt" ]; then
            KEYCHAINS=()
            while IFS= read -r keychain; do
              [ -n "$keychain" ] && KEYCHAINS+=("$keychain")
            done < "$RUNNER_TEMP/original-keychains.txt"
            if [ "${#KEYCHAINS[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${KEYCHAINS[@]}"
            fi
          fi
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/pane-developer-id.p12" "$RUNNER_TEMP/original-keychains.txt"
