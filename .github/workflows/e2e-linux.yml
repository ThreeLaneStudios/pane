name: E2E — Linux Smoke (plumbing proof)

# #470 PR 2 (revised order): before any journey content is written, prove
# the three links journeys will depend on -- app build, the
# tauri-plugin-playwright socket bridge, and screenshot() -- actually
# complete end to end, on a real GitHub-hosted Linux runner.
#
# Why this has to exist: e2e-tier1 (.github/workflows/e2e.yml) has never
# produced a single run (self-hosted macOS, workflow_dispatch-only -- see
# that file's own header for why: fork-PR RCE on Matt's Studio hardware).
# The Studio runner also has no window-server session at all, which is the
# actual reason this job has to be GitHub-hosted Linux under a virtual
# display rather than anything that could run on the Studio box.
# tauri-plugin-playwright's screenshot() API was, until this workflow,
# verified only at the TypeScript declaration level
# (node_modules/@srsholmes/tauri-playwright/dist/index.d.ts) -- the paired
# Rust-side plugin command had never actually executed, on CI or anywhere
# else. This workflow is that first real execution.
#
# Deliberately a NEW file, not an edit to e2e.yml -- e2e.yml stays
# self-hosted/macOS/workflow_dispatch-only per its own RCE note.
#
# docs/spec/testing.md §25.13 says journeys do not run on ordinary pull
# requests. The pull_request trigger below is scoped to this workflow
# file's own path AND the e2e/ directory (journeys, helpers, test setup)
# -- so this PR (and PR 480 round 2, a helper-only change) can prove
# itself green (or honestly red) before merge without a manual
# workflow_dispatch, and so can any future PR that touches a journey, a
# shared helper, or the test config. Ordinary PRs that touch neither this
# file nor e2e/** still don't trigger this workflow at all -- it is not a
# general PR trigger and does not violate §25.13's rule.
#
# #470 PR 4: this same job now also runs the first journey
# (e2e/journeys/create-an-agent.journey.ts) against the same already-
# running Pane process the smoke tests use, against a mock Ollama
# endpoint (e2e/journeys/mock-ollama.mjs) -- the only live network call
# this journey forces, per the PR 4 scope's own trace. This keeps the
# journey's first real CI proof on the one workflow file already proven
# to self-trigger on a PR via the `paths:` filter below (this file's own
# path), rather than adding a second workflow file with no equivalent
# trigger for this PR to prove itself against. A standalone
# `journeys.yml` (workflow_dispatch + bump-PR + release-tag triggers) is
# still the right home for this journey on an ongoing basis -- out of
# scope for this PR, which only needs to prove the journey runs green on
# Linux once, the same bar PR 2 set for the smoke tests.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/e2e-linux.yml'
      - 'e2e/**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `runner.temp` is not available in jobs.<job_id>.env -- the `runner`
      # context only resolves inside steps. Hoisting it to job level (as a
      # prior revision of this file did) parses as valid YAML but fails
      # GitHub's workflow *validation*, which silently produces a stub run
      # with zero jobs and conclusion "workflow file issue" -- no error
      # surfaced anywhere else. Computing the paths here, once, from
      # $RUNNER_TEMP (the env var equivalent, which IS available in `run:`)
      # and writing them to $GITHUB_ENV keeps the "Seed journey fixture"
      # step and the "Start Pane under Xvfb" step agreeing on the exact
      # same paths, without a job-level env: block.
      - name: Compute test paths (PANE_TEST_MODE/ROOT/DB)
        run: |
          echo "PANE_TEST_MODE=1" >> "$GITHUB_ENV"
          echo "PANE_TEST_ROOT=${RUNNER_TEMP}/pane-test-root" >> "$GITHUB_ENV"
          echo "PANE_TEST_DB=${RUNNER_TEMP}/pane-test-root/test.db" >> "$GITHUB_ENV"

      # #470 (fonts PR): fonts-inter + fonts-noto-color-emoji added to this
      # same apt-get install call (one apt-get update, no second network
      # round trip) rather than a separate step -- matches how every other
      # dependency here is already installed. fontconfig is almost
      # certainly already present transitively via libwebkit2gtk-4.1-dev,
      # but listed explicitly since the next step depends on `fc-cache`
      # existing. Both fonts are standard Ubuntu `universe` packages,
      # SIL Open Font License 1.1 (redistributable in CI, confirmed in
      # docs/audits/2026-11-26-scope-470-fonts.md §2) -- no vendored
      # binaries, no separate license step beyond this comment.
      #
      # Noto Color Emoji note: Reed traced the actual glyphs rendered by
      # the six journey screenshots and found zero emoji on that path --
      # every icon there is inline SVG. This install does not change any
      # of those six images. It's installed anyway per Matt's instruction,
      # because real emoji usage exists elsewhere in the app (outside this
      # journey's path) -- see the same audit §2/§"Also covered".
      - name: Install Tauri 2.x Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            build-essential \
            pkg-config \
            curl \
            file \
            xvfb \
            fonts-inter \
            fonts-noto-color-emoji \
            fontconfig

      # #470 (fonts PR): installing the Inter package alone is not
      # sufficient -- Reed's audit counted ~50 font-family rules across
      # src/ (including src/app.css:188, the html,body root every
      # unstyled element inherits) that hardcode
      # `-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif`
      # with no 'Inter' anywhere in the list -- CSS fallback can never
      # reach a name that isn't written. e2e/ci-fonts/local.conf (new file,
      # not under src/) intercepts the font lookup itself at the
      # fontconfig layer, so those names resolve straight to Inter
      # regardless of what the CSS stack lists. App code (app.css, every
      # component) is unchanged. Must run before "Start Pane under Xvfb"
      # (fontconfig is read at WebKitGTK render time, not build time) --
      # placed here, right after the matching apt step, to keep all
      # system-dependency setup together.
      - name: Install CI fonts (Inter + emoji) and alias Apple/Microsoft stacks to Inter
        run: |
          sudo mkdir -p /etc/fonts
          sudo cp e2e/ci-fonts/local.conf /etc/fonts/local.conf
          fc-cache -f

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.29.2

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend (populates build/, embedded via frontendDist)
        run: pnpm build

      # custom-protocol is the feature `tauri build`/`tauri dev --release`
      # uses to embed `build/` instead of loading `devUrl` at runtime --
      # needed here because nothing in this job runs a Vite dev server.
      # debug_assertions (not custom-protocol) is what gates the
      # tauri-plugin-playwright registration in lib.rs, so this is still a
      # debug build with the test plugin compiled in.
      - name: Build Pane (debug, embedded frontend)
        working-directory: src-tauri
        run: cargo build --bin pane --features tauri/custom-protocol

      # #470 PR 3: seeds a real ai_agents row (is_default=1, is_active=1,
      # runtime_type='ollama') through the real create_local_agent command,
      # at the exact PANE_TEST_DB/PANE_TEST_ROOT path the "Start Pane"
      # step below launches against -- so should_show_onboarding (notes.rs)
      # resolves past onboarding instead of showing Onboarding.svelte. No
      # committed database file, no hand-written SQL -- see
      # src-tauri/src/seed_journey_fixture.rs's own doc comment for the
      # full mechanism and why it's a lib unit test, not a tests/*.rs
      # integration test. #[ignore]-gated so it never runs in the default
      # `cargo test` sweep (ci.yml); invoked explicitly here via
      # --ignored.
      # #470 PR 4: started before the seed step (which writes
      # MOCK_OLLAMA_ENDPOINT into the seeded ollama_endpoint setting) and
      # before Pane launches -- order matters so the seed step has the
      # mock's real bound port to write, and so the one unconditional
      # startup dial (lib.rs's eager ModelRegistry populate) has
      # something listening from the first launch instant.
      # #470 PR 474 round 2: fixed port 11434 (Ollama's own real default)
      # inside mock-ollama.mjs now, not an ephemeral `:0` -- so the
      # "Choose a provider" screenshot shows a real-looking
      # `http://127.0.0.1:11434` instead of an arbitrary port. Still read
      # off the one stdout line mock-ollama.mjs prints, same wait-loop
      # idiom as "Start Pane under Xvfb" below -- this step's own shell
      # logic needs no change for that.
      - name: Start mock Ollama endpoint
        run: |
          node e2e/journeys/mock-ollama.mjs > /tmp/mock-ollama.log 2>&1 &
          echo $! > /tmp/mock-ollama.pid
          PORT=""
          for i in $(seq 1 20); do
            PORT=$(grep -oE 'MOCK_OLLAMA_PORT=[0-9]+' /tmp/mock-ollama.log | cut -d= -f2)
            if [ -n "$PORT" ]; then
              echo "MOCK_OLLAMA_ENDPOINT=http://127.0.0.1:${PORT}" >> "$GITHUB_ENV"
              echo "✅ mock Ollama listening on :${PORT}"
              break
            fi
            sleep 0.5
          done
          if [ -z "$PORT" ]; then
            echo "❌ mock Ollama did not report a port after 10s"; cat /tmp/mock-ollama.log; exit 1
          fi

      # #470 PR 4: reads MOCK_OLLAMA_ENDPOINT (set by the step above) and
      # seeds that as the ollama_endpoint setting instead of the inert
      # 127.0.0.1:1 address -- additive env override in
      # seed_journey_fixture.rs, PR 3's own smoke-only invocation of this
      # same test is unaffected when that var is unset.
      - name: Seed journey fixture (so Pane starts past onboarding)
        working-directory: src-tauri
        run: |
          mkdir -p "$PANE_TEST_ROOT"
          cargo test --lib seed_journey_fixture -- --ignored --nocapture

      # #470 docs-template PR: GDK_SCALE=2 + a doubled Xvfb screen size are
      # both display/scale *settings*, not a capture-pipeline change --
      # investigated per the task's instruction to reach for a 2x capture
      # ("match the site's existing retina tutorial images") only if it's
      # reachable as a setting. GDK_SCALE is GTK3's own documented backend
      # scale-factor override (independent of whatever Xvfb's declared
      # resolution reports); tauri-plugin-playwright's Linux capture path
      # (native_capture.rs's `platform::screenshot`) takes its PNG straight
      # from webkit2gtk's `WebView::snapshot()`, whose surface that
      # function's own comment confirms is "already an image surface sized
      # in *device* pixels" -- so doubling the GDK scale factor doubles the
      # snapshot's pixel dimensions with no change to any Rust or
      # TypeScript capture code. The Xvfb screen is widened/heightened to
      # 2560x1700 (was 1280x800) so the now-2400x1600-device-pixel window
      # (1200x800 logical × 2) has room to exist on the virtual display at
      # all -- a window physically can't be larger than the X server's own
      # framebuffer. No other step in this job changes; e2e/helpers/
      # screenshot.ts and every journey step file are untouched.
      - name: Start Pane under Xvfb, wait for the test socket
        run: |
          mkdir -p "$PANE_TEST_ROOT"
          rm -f /tmp/tauri-playwright.sock
          GDK_SCALE=2 xvfb-run --auto-servernum --server-args="-screen 0 2560x1700x24" \
            ./src-tauri/target/debug/pane > /tmp/pane-test.log 2>&1 &
          echo $! > /tmp/pane.pid
          echo "Pane starting (PID $(cat /tmp/pane.pid)), waiting for test socket..."
          for i in $(seq 1 90); do
            if [ -e /tmp/tauri-playwright.sock ]; then
              echo "✅ test socket ready after ${i}s"
              break
            fi
            sleep 1
          done
          if [ ! -e /tmp/tauri-playwright.sock ]; then
            echo "❌ test socket not found after 90s"
            echo "Last 150 lines of Pane log:"
            tail -150 /tmp/pane-test.log
            exit 1
          fi

      # Runs e2e/tests/smoke.spec.ts (no new content there). Both tests
      # now run: the "Seed journey fixture" step above means a default
      # ollama agent exists before Pane launches, so should_show_onboarding
      # (notes.rs) resolves past onboarding and ".sidebar" actually renders
      # -- "Pane sidebar is visible" no longer needs excluding via --grep.
      #
      # #470 (fonts PR): the `smoke` project's testMatch now also picks up
      # e2e/tests/fonts.spec.ts (playwright.config.ts) -- the font-identity
      # check runs here, via this same existing step, no new workflow step.
      - name: Run smoke e2e test (existing e2e/tests/smoke.spec.ts + fonts.spec.ts)
        run: npx playwright test --config=e2e/playwright.config.ts --project=smoke

      # #470 PR 4: the first journey, against the SAME already-running Pane
      # process the smoke test above just used. e2e/journeys/create-an-
      # agent.journey.ts writes one PNG per step + manifest.json to
      # e2e/journeys-output/create-an-agent/ (the "Upload journey artifact"
      # step below uploads that whole directory as one artifact). Round 2
      # (PR 474) added an opening step -- 6 steps/PNGs now, not 5.
      - name: Run "Create an agent" journey
        run: npx playwright test --config=e2e/playwright.config.ts --project=journeys

      # #470 docs-template PR: consumes the SAME run's manifest.json +
      # screenshots the journey step above just wrote -- no cross-job
      # download, no second checkout. Runs via plain `node` (Node 26's
      # native TypeScript support), not Playwright -- this is a build
      # step, not a test. `--slug creating-an-agent` is Matt's ruling: the
      # generated page targets the EXISTING hand-written page's address,
      # which is not this journey's own name (`create-an-agent`) -- see
      # e2e/docs-template/generate.ts's own header comment for why those
      # differ. Publishing (committing to paneapp-ai for real) is a later
      # PR; this step only ever writes to e2e/docs-template-output/.
      #
      # #470 PR 1 (publish1): no longer also writes preview.html -- see
      # generate.ts's own header comment for why that standalone-HTML
      # proof is removed rather than kept alongside the new real-site
      # screenshot below.
      - name: Generate docs page (create-an-agent)
        run: |
          node e2e/docs-template/generate.ts \
            --manifest e2e/journeys-output/create-an-agent/manifest.json \
            --slug creating-an-agent \
            --out e2e/docs-template-output/creating-an-agent

      - name: Stop Pane
        if: always()
        run: |
          kill "$(cat /tmp/pane.pid)" 2>/dev/null || true
          rm -f /tmp/tauri-playwright.sock

      # #470 PR 4: new state this PR introduces (a second background
      # process) needs its own teardown, parallel to "Stop Pane" above --
      # the mock never writes to disk, so there's nothing else to clean up.
      - name: Stop mock Ollama
        if: always()
        run: kill "$(cat /tmp/mock-ollama.pid)" 2>/dev/null || true

      # ---------------------------------------------------------------
      # #470 PR 1 (publish1): build the REAL paneapp-ai site with the
      # generated page in place and screenshot the actual rendered
      # result. This is the proof that replaces the old standalone-HTML
      # preview.html (removed this PR) -- Matt's ruling on #470: a
      # self-styled approximation isn't good enough proof that the page
      # looks right on the live site; only the live site's own build,
      # with its own CSS and layout, is.
      #
      # `paneapp-ai` is PUBLIC (confirmed by hand before writing this
      # workflow: a plain unauthenticated `git clone` succeeds with no
      # token) -- this checkout needs no credentials, no GitHub App, no
      # PAT. That auth mechanism (scoped #470 PR, not started) is only
      # needed for the LATER publish PR's actual commit+push+open-PR step
      # against paneapp-ai -- this read-only CI checkout doesn't touch
      # that at all.
      #
      # Ephemeral CI scratch ONLY: no commit, no branch, no push, no `gh
      # pr create` step anywhere below (or anywhere else in this file)
      # touches `paneapp-ai` -- the checkout is discarded with the runner
      # at the end of the job, same as the `pane` checkout.
      # ---------------------------------------------------------------

      - name: Checkout paneapp-ai (release) -- public repo, read-only, ephemeral
        uses: actions/checkout@v4
        with:
          repository: ThreeLaneStudios/paneapp-ai
          ref: release
          path: paneapp-ai-site

      - name: Install paneapp-ai dependencies
        working-directory: paneapp-ai-site
        run: npm ci

      # Drops the generated page at Matt's ruling slug (docs/creating-an-
      # agent, taking over the existing hand-written page's address) and
      # the six new images alongside (NOT instead of) the 8 existing
      # images there today -- deleting those 8 and repointing nav.ts is
      # explicitly the LATER publishing PR's job (Matt's ruling), not
      # this one. Confirmed no filename collision between the old 8 and
      # the new 6 (entirely different naming schemes), so a plain copy
      # here is safe and doesn't silently clobber anything.
      - name: Drop the generated docs page + images into the paneapp-ai checkout
        run: |
          cp e2e/docs-template-output/creating-an-agent/+page.svelte \
            paneapp-ai-site/src/routes/docs/creating-an-agent/+page.svelte
          mkdir -p paneapp-ai-site/static/assets/tutorials/creating-an-agent
          cp e2e/docs-template-output/creating-an-agent/images/*.png \
            paneapp-ai-site/static/assets/tutorials/creating-an-agent/

      # `npm run build` (never `npm install`/`npm run dev`) runs
      # `node scripts/validate-short-links.js && vite build` (paneapp-
      # ai's own package.json) -- link validation runs as part of this
      # step, not skipped. A broken link anywhere on the site (not just
      # this new page) fails this step and therefore this job.
      - name: Build paneapp-ai (npm run build -- includes short-link validation)
        working-directory: paneapp-ai-site
        run: npm run build

      # Browsers are NOT installed anywhere else in this job --
      # tauri-plugin-playwright drives the native Pane app over its own
      # Unix-socket bridge (screenshot.ts), never a real browser context,
      # so @playwright/test's chromium binary has never been needed until
      # this step. Scoped to chromium only (not the full browser matrix)
      # since this step only ever screenshots one page in one browser.
      - name: Install Playwright Chromium (screenshot tool for the real-site build only)
        run: npx playwright install --with-deps chromium

      # vite preview serves the actual `npm run build` output (adapter-
      # cloudflare's build, same as what Cloudflare Pages would serve) --
      # not a dev server, not a second build. Wait-loop idiom matches
      # this same file's existing "Start mock Ollama"/"Start Pane"
      # steps above rather than a fixed sleep.
      - name: Serve the built paneapp-ai site
        working-directory: paneapp-ai-site
        run: |
          npm run preview -- --port 4321 --host 127.0.0.1 > /tmp/paneapp-ai-preview.log 2>&1 &
          echo $! > /tmp/paneapp-ai-preview.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4321/docs/creating-an-agent > /dev/null; then
              echo "✅ paneapp-ai preview server serving /docs/creating-an-agent after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:4321/docs/creating-an-agent > /dev/null; then
            echo "❌ paneapp-ai preview server did not respond after 30s"
            cat /tmp/paneapp-ai-preview.log
            exit 1
          fi

      # Full-page capture (not just the fold) -- `--wait-for-selector
      # footer` waits for the page's own last-rendered element rather
      # than a fixed timeout, so this doesn't race the page's own
      # hydration/render the same way rule 8 forbids doing to the
      # journey's screenshots (this isn't journey code, but the same
      # "wait for a real signal, not a clock" preference applies).
      - name: Screenshot the real rendered /docs/creating-an-agent page
        run: |
          mkdir -p e2e/docs-template-output/creating-an-agent/site-screenshot
          npx playwright screenshot \
            --full-page \
            --wait-for-selector=footer \
            --viewport-size=1400,1000 \
            "http://127.0.0.1:4321/docs/creating-an-agent" \
            e2e/docs-template-output/creating-an-agent/site-screenshot/creating-an-agent-rendered.png

      - name: Stop paneapp-ai preview server
        if: always()
        run: kill "$(cat /tmp/paneapp-ai-preview.pid)" 2>/dev/null || true

      # Belt-and-suspenders, matching the task's own explicit requirement:
      # confirms this job never staged/committed anything in the
      # paneapp-ai checkout (the copied-in page/images are untracked
      # working-tree changes only -- `git status --porcelain` will show
      # them as modified/untracked, which is expected and fine; this step
      # is a readable log line for a human auditing the run, not a gate --
      # the actual guarantee is structural: no step anywhere in this file
      # runs `git commit`/`git push`/`gh pr create` against paneapp-ai-site).
      - name: Log paneapp-ai working-tree state (never committed/pushed)
        if: always()
        working-directory: paneapp-ai-site
        run: git status --porcelain || true

      - name: Upload Pane process log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pane-test-log
          path: /tmp/pane-test.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pane-smoke-screenshot
          path: e2e/test-results/smoke.png
          retention-days: 30
          # warn -> error (#470 PR 3, PR #472 final audit §9): a real file
          # exists on every passing run now, asserted by the test itself
          # (captureAndValidateScreenshot's fs.existsSync check) -- a
          # missing artifact here is a regression that should fail the
          # job loudly, not the silent-warn state that let a broken run
          # go green before PR #472's fix.
          if-no-files-found: error

      # #470 PR 4: one artifact holding every step's PNG plus
      # manifest.json -- the entire e2e/journeys-output/create-an-agent/
      # directory, matching the per-journey-subdirectory layout the
      # runner (_runner.ts) writes so a later second journey doesn't
      # collide with this one's files. error (not warn): manifest.json is
      # only ever written after every step succeeds (_runner.ts), and
      # each step's own screenshot is already asserted to exist by
      # captureAndValidateScreenshot -- a missing artifact here means the
      # job should already have failed loudly before reaching this step.
      - name: Upload journey artifact (create-an-agent)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pane-journey-create-an-agent
          path: e2e/journeys-output/create-an-agent/
          retention-days: 30
          if-no-files-found: error

      # #470 PR 1 (publish1): this artifact's CONTENTS changed, its NAME
      # didn't -- Matt's ruling replaces the old self-styled
      # preview.html with a screenshot of the real paneapp-ai build, but
      # it's still "the thing Matt opens to see the page," so it keeps
      # the same artifact name a reviewer already knows to look for.
      # Now holds: the real +page.svelte (what gets committed to
      # paneapp-ai in the later publish PR), images/ (the six step
      # screenshots, same as before), and site-screenshot/ (new -- the
      # full-page capture of the actual rendered /docs/creating-an-agent
      # route on a real paneapp-ai build, Matt's actual proof). error,
      # matching the journey artifact above: by this point the job has
      # either already failed loudly or already wrote all of these --
      # a missing artifact here would be a silent regression.
      - name: Upload docs page + rendered-site-screenshot artifact (create-an-agent)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pane-docs-page-preview-create-an-agent
          path: e2e/docs-template-output/creating-an-agent/
          retention-days: 30
          if-no-files-found: error
