name: E2E — Linux Smoke (plumbing proof)

# #470 PR 2 (revised order): before any journey content is written, prove
# the three links journeys will depend on -- app build, the
# tauri-plugin-playwright socket bridge, and screenshot() -- actually
# complete end to end, on a real GitHub-hosted Linux runner.
#
# Why this has to exist: e2e-tier1 (.github/workflows/e2e.yml) has never
# produced a single run (self-hosted macOS, workflow_dispatch-only -- see
# that file's own header for why: fork-PR RCE on Matt's Studio hardware).
# The Studio runner also has no window-server session at all, which is the
# actual reason this job has to be GitHub-hosted Linux under a virtual
# display rather than anything that could run on the Studio box.
# tauri-plugin-playwright's screenshot() API was, until this workflow,
# verified only at the TypeScript declaration level
# (node_modules/@srsholmes/tauri-playwright/dist/index.d.ts) -- the paired
# Rust-side plugin command had never actually executed, on CI or anywhere
# else. This workflow is that first real execution.
#
# Deliberately a NEW file, not an edit to e2e.yml -- e2e.yml stays
# self-hosted/macOS/workflow_dispatch-only per its own RCE note.
#
# docs/spec/testing.md §25.13 says journeys do not run on ordinary pull
# requests. The pull_request trigger below is scoped to this workflow
# file's own path only, so this PR can prove itself green (or honestly
# red) before merge, without adding CI time to any other PR -- it is not a
# general PR trigger and does not violate §25.13's rule.
#
# #470 PR 4: this same job now also runs the first journey
# (e2e/journeys/create-an-agent.journey.ts) against the same already-
# running Pane process the smoke tests use, against a mock Ollama
# endpoint (e2e/journeys/mock-ollama.mjs) -- the only live network call
# this journey forces, per the PR 4 scope's own trace. This keeps the
# journey's first real CI proof on the one workflow file already proven
# to self-trigger on a PR via the `paths:` filter below (this file's own
# path), rather than adding a second workflow file with no equivalent
# trigger for this PR to prove itself against. A standalone
# `journeys.yml` (workflow_dispatch + bump-PR + release-tag triggers) is
# still the right home for this journey on an ongoing basis -- out of
# scope for this PR, which only needs to prove the journey runs green on
# Linux once, the same bar PR 2 set for the smoke tests.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/e2e-linux.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `runner.temp` is not available in jobs.<job_id>.env -- the `runner`
      # context only resolves inside steps. Hoisting it to job level (as a
      # prior revision of this file did) parses as valid YAML but fails
      # GitHub's workflow *validation*, which silently produces a stub run
      # with zero jobs and conclusion "workflow file issue" -- no error
      # surfaced anywhere else. Computing the paths here, once, from
      # $RUNNER_TEMP (the env var equivalent, which IS available in `run:`)
      # and writing them to $GITHUB_ENV keeps the "Seed journey fixture"
      # step and the "Start Pane under Xvfb" step agreeing on the exact
      # same paths, without a job-level env: block.
      - name: Compute test paths (PANE_TEST_MODE/ROOT/DB)
        run: |
          echo "PANE_TEST_MODE=1" >> "$GITHUB_ENV"
          echo "PANE_TEST_ROOT=${RUNNER_TEMP}/pane-test-root" >> "$GITHUB_ENV"
          echo "PANE_TEST_DB=${RUNNER_TEMP}/pane-test-root/test.db" >> "$GITHUB_ENV"

      - name: Install Tauri 2.x Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            build-essential \
            pkg-config \
            curl \
            file \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.29.2

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend (populates build/, embedded via frontendDist)
        run: pnpm build

      # custom-protocol is the feature `tauri build`/`tauri dev --release`
      # uses to embed `build/` instead of loading `devUrl` at runtime --
      # needed here because nothing in this job runs a Vite dev server.
      # debug_assertions (not custom-protocol) is what gates the
      # tauri-plugin-playwright registration in lib.rs, so this is still a
      # debug build with the test plugin compiled in.
      - name: Build Pane (debug, embedded frontend)
        working-directory: src-tauri
        run: cargo build --bin pane --features tauri/custom-protocol

      # #470 PR 3: seeds a real ai_agents row (is_default=1, is_active=1,
      # runtime_type='ollama') through the real create_local_agent command,
      # at the exact PANE_TEST_DB/PANE_TEST_ROOT path the "Start Pane"
      # step below launches against -- so should_show_onboarding (notes.rs)
      # resolves past onboarding instead of showing Onboarding.svelte. No
      # committed database file, no hand-written SQL -- see
      # src-tauri/src/seed_journey_fixture.rs's own doc comment for the
      # full mechanism and why it's a lib unit test, not a tests/*.rs
      # integration test. #[ignore]-gated so it never runs in the default
      # `cargo test` sweep (ci.yml); invoked explicitly here via
      # --ignored.
      # #470 PR 4: started before the seed step (which writes
      # MOCK_OLLAMA_ENDPOINT into the seeded ollama_endpoint setting) and
      # before Pane launches -- order matters so the seed step has the
      # mock's real bound port to write, and so the one unconditional
      # startup dial (lib.rs's eager ModelRegistry populate) has
      # something listening from the first launch instant. Ephemeral port
      # (`:0` inside mock-ollama.mjs) -- read off the one stdout line it
      # prints, same wait-loop idiom as "Start Pane under Xvfb" below.
      - name: Start mock Ollama endpoint
        run: |
          node e2e/journeys/mock-ollama.mjs > /tmp/mock-ollama.log 2>&1 &
          echo $! > /tmp/mock-ollama.pid
          PORT=""
          for i in $(seq 1 20); do
            PORT=$(grep -oE 'MOCK_OLLAMA_PORT=[0-9]+' /tmp/mock-ollama.log | cut -d= -f2)
            if [ -n "$PORT" ]; then
              echo "MOCK_OLLAMA_ENDPOINT=http://127.0.0.1:${PORT}" >> "$GITHUB_ENV"
              echo "✅ mock Ollama listening on :${PORT}"
              break
            fi
            sleep 0.5
          done
          if [ -z "$PORT" ]; then
            echo "❌ mock Ollama did not report a port after 10s"; cat /tmp/mock-ollama.log; exit 1
          fi

      # #470 PR 4: reads MOCK_OLLAMA_ENDPOINT (set by the step above) and
      # seeds that as the ollama_endpoint setting instead of the inert
      # 127.0.0.1:1 address -- additive env override in
      # seed_journey_fixture.rs, PR 3's own smoke-only invocation of this
      # same test is unaffected when that var is unset.
      - name: Seed journey fixture (so Pane starts past onboarding)
        working-directory: src-tauri
        run: |
          mkdir -p "$PANE_TEST_ROOT"
          cargo test --lib seed_journey_fixture -- --ignored --nocapture

      - name: Start Pane under Xvfb, wait for the test socket
        run: |
          mkdir -p "$PANE_TEST_ROOT"
          rm -f /tmp/tauri-playwright.sock
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            ./src-tauri/target/debug/pane > /tmp/pane-test.log 2>&1 &
          echo $! > /tmp/pane.pid
          echo "Pane starting (PID $(cat /tmp/pane.pid)), waiting for test socket..."
          for i in $(seq 1 90); do
            if [ -e /tmp/tauri-playwright.sock ]; then
              echo "✅ test socket ready after ${i}s"
              break
            fi
            sleep 1
          done
          if [ ! -e /tmp/tauri-playwright.sock ]; then
            echo "❌ test socket not found after 90s"
            echo "Last 150 lines of Pane log:"
            tail -150 /tmp/pane-test.log
            exit 1
          fi

      # Runs the EXISTING e2e/tests/smoke.spec.ts (no new test content).
      # Both tests now run: the "Seed journey fixture" step above means a
      # default ollama agent exists before Pane launches, so
      # should_show_onboarding (notes.rs) resolves past onboarding and
      # ".sidebar" actually renders -- "Pane sidebar is visible" no longer
      # needs excluding via --grep.
      - name: Run smoke e2e test (existing e2e/tests/smoke.spec.ts)
        run: npx playwright test --config=e2e/playwright.config.ts --project=smoke

      # #470 PR 4: the first journey, against the SAME already-running Pane
      # process the smoke test above just used. e2e/journeys/create-an-
      # agent.journey.ts writes 5 step PNGs + manifest.json to
      # e2e/journeys-output/create-an-agent/ (the "Upload journey artifact"
      # step below uploads that whole directory as one artifact).
      - name: Run "Create an agent" journey
        run: npx playwright test --config=e2e/playwright.config.ts --project=journeys

      - name: Stop Pane
        if: always()
        run: |
          kill "$(cat /tmp/pane.pid)" 2>/dev/null || true
          rm -f /tmp/tauri-playwright.sock

      # #470 PR 4: new state this PR introduces (a second background
      # process) needs its own teardown, parallel to "Stop Pane" above --
      # the mock never writes to disk, so there's nothing else to clean up.
      - name: Stop mock Ollama
        if: always()
        run: kill "$(cat /tmp/mock-ollama.pid)" 2>/dev/null || true

      - name: Upload Pane process log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pane-test-log
          path: /tmp/pane-test.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pane-smoke-screenshot
          path: e2e/test-results/smoke.png
          retention-days: 30
          # warn -> error (#470 PR 3, PR #472 final audit §9): a real file
          # exists on every passing run now, asserted by the test itself
          # (captureAndValidateScreenshot's fs.existsSync check) -- a
          # missing artifact here is a regression that should fail the
          # job loudly, not the silent-warn state that let a broken run
          # go green before PR #472's fix.
          if-no-files-found: error

      # #470 PR 4: one artifact holding all five step PNGs plus
      # manifest.json -- the entire e2e/journeys-output/create-an-agent/
      # directory, matching the per-journey-subdirectory layout the
      # runner (_runner.ts) writes so a later second journey doesn't
      # collide with this one's files. error (not warn): manifest.json is
      # only ever written after all five steps succeed (_runner.ts), and
      # each step's own screenshot is already asserted to exist by
      # captureAndValidateScreenshot -- a missing artifact here means the
      # job should already have failed loudly before reaching this step.
      - name: Upload journey artifact (create-an-agent)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pane-journey-create-an-agent
          path: e2e/journeys-output/create-an-agent/
          retention-days: 30
          if-no-files-found: error
