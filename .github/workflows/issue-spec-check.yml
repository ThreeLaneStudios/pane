name: Issue Spec Section Check

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  check-spec-section:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Spec Section
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const labels = issue.labels.map(l => l.name);
            
            // Skip audit-created issues
            if (labels.includes('audit')) {
              console.log('Audit issue — skipping spec check');
              return;
            }
            
            // Check for spec section reference
            const hasSpecSection = /[Ss]pec [Ss]ection|§\d+/.test(body);
            
            if (!hasSpecSection) {
              // Add label
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-spec-section']
              });
              
              // Add comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '⚠️ **Missing Spec Section.** Every issue must reference a spec section.\n\nPlease edit this issue to add a `Spec Section:` field with either:\n- `§X.Y` — the relevant architecture spec section\n- `NEW — needs spec section` — if this is new work without a spec section yet\n\nSee [CONTRIBUTING.md](https://github.com/ThreeLaneStudios/pane/blob/main/CONTRIBUTING.md) for the full workflow.'
              });
              
              console.log(`Issue #${issue.number} flagged — missing spec section`);
            } else {
              console.log(`Issue #${issue.number} has spec section — OK`);
            }
