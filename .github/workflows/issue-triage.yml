name: Issue Triage

on:
  issues:
    types: [opened, labeled, unlabeled]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Triage issue labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            const hasLaunchBlocking = labels.includes('launch-blocking');
            const hasPostLaunch = labels.includes('post-launch');
            const hasNeedsTriage = labels.includes('needs-triage');
            
            if (hasLaunchBlocking || hasPostLaunch) {
              // Has a priority label — remove needs-triage if present
              if (hasNeedsTriage) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: 'needs-triage'
                });
                console.log(`Removed needs-triage from #${issue.number}`);
              }
            } else {
              // No priority label — add needs-triage
              if (!hasNeedsTriage) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['needs-triage']
                });
                console.log(`Added needs-triage to #${issue.number}`);
              }
              
              // Comment only on newly opened issues
              if (context.payload.action === 'opened') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: 'This issue needs a `launch-blocking` or `post-launch` label. Defaulting to `needs-triage` until assigned.'
                });
              }
            }
