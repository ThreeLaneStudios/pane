name: PR Issue Reference Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-issue-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # #3260 decision 1: a PR whose diff touches only recipes/ is exempt from
      # the issue-reference rule — path-scoped, not contributor-scoped. Any
      # PR that touches anything outside recipes/, from anyone, still needs
      # one. Same changed-file-list call reed-gate.yml already makes.
      - name: Check if diff is recipes-only
        id: recipes-only
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          NON_RECIPES=$(echo "$CHANGED" | grep -v -E '^recipes/' || true)
          if [ -z "$NON_RECIPES" ]; then
            echo "recipes_only=true" >> "$GITHUB_OUTPUT"
            echo "✅ Diff is recipes/-only — issue reference not required"
          else
            echo "recipes_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for Issue Reference
        if: steps.recipes-only.outputs.recipes_only != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            
            // Regex to match #NNN patterns (not in URLs or code blocks)
            // Matches: #123, (#456), "Relates to #789", etc.
            // Avoids: http://example.com#123, github.com/owner/repo#456
            const issuePattern = /(?:^|\s|[(])#(\d+)/gm;
            const matches = [...body.matchAll(issuePattern)];
            
            if (matches.length === 0) {
              core.setFailed(
                'PR body must reference at least one issue (e.g. "Relates to #123"). See playbook §4d.'
              );
              console.log(`PR #${pr.number} — no issue references found`);
            } else {
              const issueNumbers = matches.map(m => `#${m[1]}`).join(', ');
              console.log(`PR #${pr.number} references: ${issueNumbers} ✓`);
              core.info(`Found issue references: ${issueNumbers}`);
            }
