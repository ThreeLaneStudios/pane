name: Nightly — Full Test Suite

on:
  schedule:
    # Run at 5 AM UTC (1 AM EST) every night
    - cron: '0 5 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  rust-tests:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4

      - name: Add Rust toolchain to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rust tests (full suite)
        working-directory: src-tauri
        run: cargo test --lib -- --test-threads=1

      - name: Architecture integrity check
        run: |
          echo "Checking architecture invariants..."
          FAIL=0

          if grep -rn '"Pane System"' src-tauri/src/ --include="*.rs" | grep -v "// " | grep -v "migration" | grep -v "DELETE" | grep -v "#\[test\]" | grep -v "mod tests" | grep -v "fn test_" | grep -v "_tests\.rs"; then
            echo "❌ INVARIANT: 'Pane System' found as project reference"
            FAIL=1
          fi

          if grep -rn 'verify_system_notes_integrity' src-tauri/src/ --include="*.rs" | grep -v 'legacy-ok' | grep -v 'legacy' | grep -v '_tests\.rs' | grep -v 'fn test_'; then
            echo "❌ INVARIANT: verify_system_notes_integrity without guard"
            FAIL=1
          fi

          if [ $FAIL -eq 1 ]; then exit 1; fi
          echo "✅ Architecture invariants passed"

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install pnpm
        run: npm install -g pnpm@10.29.2

      - name: Install dependencies
        run: pnpm install

      - name: Frontend tests
        run: npm run test

      - name: Svelte check
        run: npx svelte-check --tsconfig ./tsconfig.json || true

  report:
    needs: [rust-tests, frontend-tests]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      issues: write
    steps:
      - name: Update pinned tracker issue #2827
        uses: actions/github-script@v7
        with:
          script: |
            const PINNED_ISSUE_NUMBER = 2827;
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const rustResult = '${{ needs.rust-tests.result }}';
            const frontendResult = '${{ needs.frontend-tests.result }}';

            const failedJobs = [];
            if (rustResult !== 'success') failedJobs.push(`rust-tests (${rustResult})`);
            if (frontendResult !== 'success') failedJobs.push(`frontend-tests (${frontendResult})`);

            const allGreen = failedJobs.length === 0;

            const body = allGreen
              ? `## 🟢 Nightly run green — ${date}\n\nAll jobs passed (rust-tests, frontend-tests).\n\n**Run:** ${runUrl}`
              : `## 🔴 Nightly test failure — ${date}\n\n**Failed jobs:** ${failedJobs.join(', ')}\n\n**Run:** ${runUrl}\n\ncc @matthewcarano`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: PINNED_ISSUE_NUMBER,
              body
            });
