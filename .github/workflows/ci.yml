name: CI — Frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'svelte.config.js'
      - 'vite.config.*'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    # No paths filter here — must always report status

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    # #3207 correction: dorny/paths-filter@v3 on a pull_request event calls
    # the GitHub API's listFiles for the PR (confirmed live: PR #3259's own
    # first run under this workflow's new contents-read-only block failed
    # here with "Resource not accessible by integration", with no
    # pull-requests: read to cover it). Job-level permissions REPLACE,
    # not merge with, the workflow-level block above -- unlike
    # rust-tests.yml/dmg-swap-test.yml's identical `changes` job (which
    # declare pull-requests: read alone), this job also calls
    # actions/checkout@v4 first, so it needs contents: read restated here
    # too or checkout itself 403s ("Repository not found", confirmed live
    # on the first attempt at this fix, job-level pull-requests: read only).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'svelte.config.js'
              - 'vite.config.*'
              - '.github/workflows/ci.yml'

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.frontend == 'true'
      
      - name: Install Node
        uses: actions/setup-node@v4
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: '26'
      
      - name: Install pnpm
        if: needs.changes.outputs.frontend == 'true'
        run: npm install -g pnpm@10.29.2
      
      - name: Install frontend dependencies
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm install
      
      - name: Frontend tests
        if: needs.changes.outputs.frontend == 'true'
        run: npm run test
      
      - name: Svelte check
        if: needs.changes.outputs.frontend == 'true'
        run: npx svelte-check --tsconfig ./tsconfig.json || true
      
      - name: Skip — no frontend changes
        if: needs.changes.outputs.frontend != 'true'
        run: echo "No frontend changes — skipping frontend tests"

  version-parity:
    runs-on: ubuntu-latest
    name: Version parity (package.json / Cargo.toml / tauri.conf.json)
    steps:
      - uses: actions/checkout@v4
      - name: Check version parity
        run: bash scripts/check-version-parity.sh

  gateway-version-floor:
    runs-on: ubuntu-latest
    name: Gateway version vs MIN_GATEWAY_VERSION floor
    steps:
      - uses: actions/checkout@v4
      - name: Check gateway version floor
        run: bash scripts/check-gateway-version-floor.sh
        # §22C.11A.5 — Fails only if MIN_GATEWAY_VERSION is ahead of the
        # actual gateway release. Release and compatibility versions are independent.
