name: Feature Request
description: Request a new feature or enhancement for Pane
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to request a feature! Please fill out the information below.

  - type: input
    id: spec-section
    attributes:
      label: Spec Section
      description: "Which architecture spec section does this relate to? Use §X.Y format, or 'NEW: needs spec section' if none exists yet."
      placeholder: "§24.10 or NEW: needs spec section"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What feature would you like to see? Be specific.
      placeholder: "I'd like Pane to..."
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe the problem this feature would solve or the workflow it would enable.
      placeholder: "Currently, when I..., I have to..., which is inefficient because..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How do you envision this working? Include UI mockups or workflow descriptions if helpful.
      placeholder: "The feature could work by..."
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Are there workarounds or alternative approaches you've considered?
      placeholder: "I've tried..., but..."
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Would improve my workflow
        - Blocking my use of Pane
    validations:
      required: true
